<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kindle Clock</title>
<link rel="stylesheet" href="clock.css">
</head>
<body>

<div id="wrap">

  <div id="time">--:--</div>
  <div id="date">----年--月--日 星期-</div>

  <div class="hr"></div>

  <div id="city">--</div>
  <div id="tempRow">
    <span id="temp">--</span><span id="deg">&#176;</span><span id="cond"></span>
  </div>
  <div id="meta">湿度 -- &#183; --风 --级</div>

  <div class="hr"></div>

  <table id="fc" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td id="fc1a" class="fcDay">--</td>
      <td id="fc2a" class="fcDay">--</td>
      <td id="fc3a" class="fcDay">--</td>
    </tr>
    <tr>
      <td id="fc1b" class="fcW">--</td>
      <td id="fc2b" class="fcW">--</td>
      <td id="fc3b" class="fcW">--</td>
    </tr>
  </table>

  <div class="hr"></div>

  <div id="greet">--</div>
  <div id="dress">--</div>

  <div id="foot">加载中&#8230;</div>

  <!-- peeking cat: line-art, sits behind the bottom rule.
       Blinking / ear twitching are rare state switches (e-ink friendly),
       not continuous animation. -->
  <div id="catbox">
    <svg id="cat" width="300" height="185" viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round">
        <path id="head" d="M 84 175 L 78 168 L 90 160 L 78 152 L 90 144 L 78 136 L 90 128 L 82 120 C 84 104 88 92 88 80 C 88 68 95 58 106 53 l 8 -4 l 8 4 l 8 -4 l 8 4 l 8 -4 l 8 4 l 8 -4 l 8 4 l 8 -4 l 8 4 C 205 58 212 68 212 80 C 212 92 216 104 218 120 L 210 128 L 222 136 L 210 144 L 222 152 L 210 160 L 222 168 L 216 175 Z" />
        <g id="earL">
          <path d="M 86 126 C 80 100 78 66 82 34 C 84 18 88 6 93 8 C 98 11 102 26 108 38 C 114 47 121 51 130 54 L 134 88 C 120 108 100 122 86 126 Z" />
        </g>
        <g id="earR">
          <path d="M 214 126 C 220 100 222 66 218 34 C 216 18 212 6 207 8 C 202 11 198 26 192 38 C 186 47 179 51 170 54 L 166 88 C 180 108 200 122 214 126 Z" />
        </g>
      </g>
      <path d="M 4 175 L 296 175" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" />
      <g id="eyesOpen">
        <ellipse cx="112" cy="130" rx="18" ry="20" fill="#ffffff"/>
        <circle cx="119" cy="135" r="9.5" fill="#000000"/>
        <circle cx="122" cy="131" r="3" fill="#ffffff"/>
        <ellipse cx="188" cy="130" rx="18" ry="20" fill="#ffffff"/>
        <circle cx="181" cy="135" r="9.5" fill="#000000"/>
        <circle cx="184" cy="131" r="3" fill="#ffffff"/>
      </g>
      <g id="eyesClosed" display="none" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M 94 132 Q 112 143 130 132" />
        <path d="M 170 132 Q 188 143 206 132" />
      </g>
    </svg>
  </div>

</div>

<script src="clock.js"></script>
</body>
</html>
