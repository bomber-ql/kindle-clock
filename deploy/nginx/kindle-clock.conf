# /etc/nginx/conf.d/kindle-clock.conf
# 把 clock.example.com 换成你自己的域名；改完 nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name clock.example.com;

    # Kindle 的老浏览器对 gzip 支持不稳，这里不做压缩、不做缓存改写
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 天气接口：内容本身已带 10 分钟缓存头，这里直接透传
    location /api/weather {
        proxy_pass http://127.0.0.1:8787/api/weather;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# HTTPS 由 certbot 自动生成（certbot --nginx -d clock.example.com），
# 生成后这个文件会被自动追加 443 的 server 块，无需手写。
