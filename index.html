<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kindle Clock</title>
<link rel="stylesheet" href="clock.css">
</head>
<body>

<div id="wrap">

  <div id="time">--:--</div>
  <div id="date">----年--月--日 星期-</div>

  <div class="hr"></div>

  <div id="city">--</div>
  <div id="tempRow">
    <span id="temp">--</span><span id="deg">&#176;</span><span id="cond"></span>
  </div>
  <div id="meta">湿度 -- &#183; --风 --级</div>

  <div class="hr"></div>

  <table id="fc" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td id="fc1a" class="fcDay">--</td>
      <td id="fc2a" class="fcDay">--</td>
      <td id="fc3a" class="fcDay">--</td>
    </tr>
    <tr>
      <td id="fc1b" class="fcW">--</td>
      <td id="fc2b" class="fcW">--</td>
      <td id="fc3b" class="fcW">--</td>
    </tr>
  </table>

  <div class="hr"></div>

  <div id="greet">--</div>
  <div id="dress">--</div>

  <div id="foot">加载中&#8230;</div>

  <!-- peeking cat: line-art, sits behind the bottom rule.
       Blinking / ear twitching are rare state switches (e-ink friendly),
       not continuous animation. -->
  <div id="catbox">
    <svg id="cat" width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round">
        <path id="head" d="M 37 115 C 36 112 39 110 37 107 C 35 104 38 102 40 99 C 43 94 45 90 48 84 C 50 76 50 68 52 62 C 58 52 66 46 78 48 q 7 -6 14 -2 q 7 -4 14 0 q 7 5 14 2 q 7 -6 14 -2 q 7 -3 14 1 q 7 5 14 2 q 7 -6 14 -2 q 7 4 14 1 q 7 -4 14 0 q 7 5 14 2 q 2 1 4 0 C 226 46 232 48 238 54 C 244 58 248 62 248 62 C 250 68 250 76 252 84 C 255 90 257 94 260 99 C 262 102 265 104 263 107 C 261 110 264 112 263 115 Z" />
        <g id="earL">
          <path d="M 52 66 C 55 48 60 30 68 20 C 74 11 80 6 84 10 C 88 14 92 26 98 34 C 102 38 105 41 108 44 L 110 62 L 52 74 Z" />
        </g>
        <g id="earR">
          <path d="M 248 66 C 245 48 240 30 232 20 C 226 11 220 6 216 10 C 212 14 208 26 202 34 C 198 38 195 41 192 44 L 190 62 L 248 74 Z" />
        </g>
      </g>
      <path d="M 4 115 L 296 115" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" />
      <g id="eyesOpen">
        <ellipse cx="112" cy="82" rx="18" ry="20" fill="#ffffff"/>
        <circle cx="119" cy="87" r="9.5" fill="#000000"/>
        <circle cx="122" cy="83" r="3" fill="#ffffff"/>
        <ellipse cx="188" cy="82" rx="18" ry="20" fill="#ffffff"/>
        <circle cx="181" cy="87" r="9.5" fill="#000000"/>
        <circle cx="184" cy="83" r="3" fill="#ffffff"/>
      </g>
      <g id="eyesClosed" display="none" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M 94 84 Q 112 95 130 84" />
        <path d="M 170 84 Q 188 95 206 84" />
      </g>
    </svg>
  </div>

</div>

<script src="clock.js"></script>
</body>
</html>
