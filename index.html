<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kindle Clock</title>
<link rel="stylesheet" href="clock.css">
</head>
<body>

<div id="wrap">

  <div id="time">--:--</div>
  <div id="date">----年--月--日 星期-</div>

  <div class="hr"></div>

  <div id="city">--</div>
  <div id="tempRow">
    <span id="temp">--</span><span id="deg">&#176;</span><span id="cond"></span>
  </div>
  <div id="meta">湿度 -- &#183; --风 --级</div>

  <div class="hr"></div>

  <table id="fc" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td id="fc1a" class="fcDay">--</td>
      <td id="fc2a" class="fcDay">--</td>
      <td id="fc3a" class="fcDay">--</td>
    </tr>
    <tr>
      <td id="fc1b" class="fcW">--</td>
      <td id="fc2b" class="fcW">--</td>
      <td id="fc3b" class="fcW">--</td>
    </tr>
  </table>

  <div class="hr"></div>

  <div id="greet">--</div>
  <div id="dress">--</div>

  <div id="foot">加载中&#8230;</div>

  <!-- peeking cat: line-art, sits behind the bottom rule.
       Blinking / ear twitching are rare state switches (e-ink friendly),
       not continuous animation. -->
  <div id="catbox">
    <svg id="cat" width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="#000000" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g id="earL">
          <path d="M 34 102 C 36 84 40 62 50 44 C 56 32 64 22 72 20 C 80 18 88 26 96 36 C 102 44 108 48 114 51" />
          <path d="M 58 46 C 62 36 68 30 76 36 C 82 41 88 44 94 45" />
        </g>
        <g id="earR">
          <path d="M 266 102 C 264 84 260 62 250 44 C 244 32 236 22 228 20 C 220 18 212 26 204 36 C 198 44 192 48 186 51" />
          <path d="M 242 46 C 238 36 232 30 224 36 C 218 41 212 44 206 45" />
        </g>
        <path d="M 114 51 C 120 45 128 45 134 49 C 140 44 148 44 152 48 C 156 44 164 44 170 49 C 176 45 182 45 186 51" />
        <path d="M 34 102 C 30 108 32 111 26 115" />
        <path d="M 266 102 C 270 108 268 111 274 115" />
        <path d="M 4 115 L 296 115" />
      </g>
      <g id="eyesOpen">
        <ellipse cx="105" cy="80" rx="17" ry="19" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <circle cx="112" cy="84" r="8" fill="#000000"/>
        <circle cx="115" cy="81" r="2.8" fill="#ffffff"/>
        <ellipse cx="195" cy="80" rx="17" ry="19" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <circle cx="188" cy="84" r="8" fill="#000000"/>
        <circle cx="191" cy="81" r="2.8" fill="#ffffff"/>
      </g>
      <g id="eyesClosed" display="none" stroke="#000000" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M 88 80 Q 105 91 122 80" />
        <path d="M 178 80 Q 195 91 212 80" />
      </g>
    </svg>
  </div>

</div>

<script src="clock.js"></script>
</body>
</html>
