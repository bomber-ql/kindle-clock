<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kindle Clock</title>
<link rel="stylesheet" href="clock.css">
</head>
<body>

<div id="wrap">

  <div id="time">--:--</div>
  <div id="date">----年--月--日 星期-</div>

  <div class="hr"></div>

  <div id="city">--</div>
  <div id="tempRow">
    <span id="temp">--</span><span id="deg">&#176;</span><span id="cond"></span>
  </div>
  <div id="meta">湿度 -- &#183; --风 --级</div>

  <div class="hr"></div>

  <table id="fc" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td id="fc1a" class="fcDay">--</td>
      <td id="fc2a" class="fcDay">--</td>
      <td id="fc3a" class="fcDay">--</td>
    </tr>
    <tr>
      <td id="fc1b" class="fcW">--</td>
      <td id="fc2b" class="fcW">--</td>
      <td id="fc3b" class="fcW">--</td>
    </tr>
  </table>

  <div class="hr"></div>

  <div id="greet">--</div>
  <div id="dress">--</div>

  <div id="foot">加载中&#8230;</div>

  <!-- peeking cat: line-art, sits behind the bottom rule.
       Blinking / ear twitching are rare state switches (e-ink friendly),
       not continuous animation. -->
  <div id="catbox">
    <svg id="cat" width="300" height="185" viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round">
        <path id="head" d="M 37 175 C 36 172 39 170 37 167 C 35 164 38 162 40 159 C 43 154 45 148 47 140 C 49 130 50 118 52 100 C 54 88 58 66 70 56 C 74 52 77 51 80 50 q 7 -6 14 -2 q 7 -4 14 0 q 7 5 14 2 q 7 -6 14 -2 q 7 -3 14 1 q 7 5 14 2 q 7 -6 14 -2 q 7 4 14 1 q 7 -4 14 0 q 7 5 14 2 C 226 50 230 52 236 58 C 244 68 248 88 250 100 C 252 118 253 130 255 140 C 257 148 259 154 262 159 C 264 162 267 164 265 167 C 263 170 266 172 265 175 Z" />
        <g id="earL">
          <path d="M 54 96 C 56 74 62 44 70 26 C 76 12 82 4 86 8 C 90 12 94 26 100 38 C 104 45 107 49 112 54 L 116 74 L 56 108 Z" />
        </g>
        <g id="earR">
          <path d="M 246 96 C 244 74 238 44 230 26 C 224 12 218 4 214 8 C 210 12 206 26 200 38 C 196 45 193 49 188 54 L 184 74 L 244 108 Z" />
        </g>
      </g>
      <path d="M 4 175 L 296 175" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" />
      <g id="eyesOpen">
        <ellipse cx="112" cy="130" rx="18" ry="20" fill="#ffffff"/>
        <circle cx="119" cy="135" r="9.5" fill="#000000"/>
        <circle cx="122" cy="131" r="3" fill="#ffffff"/>
        <ellipse cx="188" cy="130" rx="18" ry="20" fill="#ffffff"/>
        <circle cx="181" cy="135" r="9.5" fill="#000000"/>
        <circle cx="184" cy="131" r="3" fill="#ffffff"/>
      </g>
      <g id="eyesClosed" display="none" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M 94 132 Q 112 143 130 132" />
        <path d="M 170 132 Q 188 143 206 132" />
      </g>
    </svg>
  </div>

</div>

<script src="clock.js"></script>
</body>
</html>
