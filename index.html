<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kindle Clock</title>
<link rel="stylesheet" href="clock.css">
</head>
<body>

<div id="wrap">

  <div id="time">--:--</div>
  <div id="date">----年--月--日 星期-</div>

  <div class="hr"></div>

  <div id="city">--</div>
  <div id="tempRow">
    <span id="temp">--</span><span id="deg">&#176;</span><span id="cond"></span>
  </div>
  <div id="meta">湿度 -- &#183; --风 --级</div>

  <div class="hr"></div>

  <table id="fc" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td id="fc1a" class="fcDay">--</td>
      <td id="fc2a" class="fcDay">--</td>
      <td id="fc3a" class="fcDay">--</td>
    </tr>
    <tr>
      <td id="fc1b" class="fcW">--</td>
      <td id="fc2b" class="fcW">--</td>
      <td id="fc3b" class="fcW">--</td>
    </tr>
  </table>

  <div class="hr"></div>

  <div id="greet">--</div>
  <div id="dress">--</div>

  <div id="foot">加载中&#8230;</div>

  <!-- peeking cat: line-art, sits behind the bottom rule.
       Blinking / ear twitching are rare state switches (e-ink friendly),
       not continuous animation. -->
  <div id="catbox">
    <svg id="cat" width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g id="earL">
          <path d="M 48 86 C 52 68 58 42 68 28 C 74 19 80 15 84 19 C 88 23 92 32 98 40 C 102 45 105 49 108 52" />
        </g>
        <g id="earR">
          <path d="M 252 86 C 248 68 242 42 232 28 C 226 19 220 15 216 19 C 212 23 208 32 202 40 C 198 45 195 49 192 52" />
        </g>
        <path d="M 108 52 q 5 -6 10 -2 q 5 -4 10 0 q 5 5 10 2 q 5 -6 10 -2 q 5 -3 10 1 q 5 5 10 2 q 5 -4 10 0 q 2 1 4 1" />
        <path d="M 48 86 C 45 92 44 96 41 101 C 39 105 42 107 39 110 C 36 113 39 114 37 115" />
        <path d="M 252 86 C 255 92 256 96 259 101 C 261 105 258 107 261 110 C 264 113 261 114 263 115" />
        <path d="M 4 115 L 296 115" />
      </g>
      <g id="eyesOpen">
        <ellipse cx="112" cy="80" rx="18" ry="20" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
        <circle cx="119" cy="85" r="9.5" fill="#000000"/>
        <circle cx="122" cy="81" r="3" fill="#ffffff"/>
        <ellipse cx="188" cy="80" rx="18" ry="20" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
        <circle cx="181" cy="85" r="9.5" fill="#000000"/>
        <circle cx="184" cy="81" r="3" fill="#ffffff"/>
      </g>
      <g id="eyesClosed" display="none" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M 94 82 Q 112 93 130 82" />
        <path d="M 170 82 Q 188 93 206 82" />
      </g>
    </svg>
  </div>

</div>

<script src="clock.js"></script>
</body>
</html>
